<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>AR.js + A-Frame + GIF vía Canvas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Gestos (opcional, como usabas) -->
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
    <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

    <!-- gifler para animar GIFs en <canvas> -->
    <script src="https://unpkg.com/gifler/gifler.min.js"></script>

    <!-- Componente para usar un canvas como textura y refrescarla cada frame -->
    <script>
      AFRAME.registerComponent('canvas-gif-texture', {
        schema: { src: { type: 'selector' } },
        init: function () {
          const id = this.data.src && this.data.src.id ? this.data.src.id : null;
          if (!id) {
            console.warn('[canvas-gif-texture] No se recibió un canvas válido en "src".');
            return;
          }
          // IMPORTANTE: usar "#<id>" (con numeral) para que A-Frame encuentre el asset
          this.el.setAttribute(
            'material',
            `shader: flat; transparent: true; side: double; src: #${id}`
          );
        },
        tick: function () {
          // Fuerza a que la textura del material se actualice cada frame
          const mesh = this.el.getObject3D('mesh');
          if (mesh && mesh.material && mesh.material.map) {
            mesh.material.map.needsUpdate = true;
          }
        }
      });
    </script>
  </head>

  <body style="margin:0; overflow:hidden;">
    <a-scene
      vr-mode-ui="enabled: false"
      loading-screen="enabled: false"
      embedded
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
      gesture-detector
    >
      <a-assets>
        <!-- POT recomendado (512x512). Ajusta si tu GIF es cuadrado/no cuadrado -->
        <canvas id="gifCanvas" width="512" height="512"></canvas>
      </a-assets>

      <a-marker
        type="pattern"
        preset="custom"
        url="assets/marker.patt"
        raycaster="objects: .clickable"
        emitevents="true"
        cursor="fuse: false; rayOrigin: mouse;"
        id="markerA"
      >
        <!-- Plano que toma la textura del canvas mediante el componente -->
        <a-plane
          id="gifPlane"
          canvas-gif-texture="src: #gifCanvas"
          width="1"
          height="1"
          rotation="-90 0 0"
          class="clickable"
          gesture-handler
        ></a-plane>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // --- Reproducción del GIF dentro del canvas ---
      const canvas = document.getElementById('gifCanvas');
      const ctx = canvas.getContext('2d');

      // Placeholder mientras carga
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('Cargando GIF…', canvas.width / 2, canvas.height / 2);

      // Si el GIF está en el MISMO dominio, NO pongas crossOrigin.
      // Si está en OTRO dominio con CORS correcto, puedes usar crossOrigin='anonymous'.
      gifler('assets/asset.gif').get((anim) => {
        // Limpia y dibuja cada frame al tamaño del canvas
        anim.onDrawFrame = function (drawCtx, frame) {
          drawCtx.clearRect(0, 0, canvas.width, canvas.height);
          drawCtx.drawImage(frame.buffer, 0, 0, canvas.width, canvas.height);
        };
        anim.loopCount = 0;           // 0 = loop infinito
        anim.setFrameIndex(0);
        anim.animateInCanvas(canvas); // inicia el bucle interno de gifler
        anim.play();
      }, (err) => {
        console.error('Error cargando el GIF:', err);
      });
    </script>
  </body>
</html>
